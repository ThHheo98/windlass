<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Windlass narrowboat</title>
  <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  <g clip-path="url(#tile)">
  <rect width="64" height="64" fill="#0e5b66"/>
  <path d="M0 47h64v17H0z" fill="#0a4a54"/>
  <path d="M5 55.5c2.5-2 5-2 7.5 0s5 2 7.5 0 5-2 7.5 0 5 2 7.5 0 5-2 7.5 0 5 2 7.5 0 5-2 7.5 0" fill="none" stroke="#7cc6cf" stroke-width="2" stroke-linecap="round"/>
  <!-- smoke -->
  <circle cx="46" cy="19.5" r="2.1" fill="#d9e6e8" opacity=".85"/>
  <circle cx="49.5" cy="16.5" r="1.5" fill="#d9e6e8" opacity=".65"/>
  <!-- chimney with brass band -->
  <rect x="42.5" y="22.5" width="3.4" height="9" rx=".7" fill="#1d1d1b"/>
  <rect x="42.5" y="24" width="3.4" height="1.6" fill="#e0a526"/>
