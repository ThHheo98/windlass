  <!-- row of portholes -->
  <circle cx="16" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <circle cx="22" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <circle cx="28" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <circle cx="34" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <circle cx="40" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <circle cx="46" cy="36.5" r="1.7" fill="#f3e6c8"/>
  <!-- long green hull with a cream line and a raised, pointed bow -->
  <path d="M4 40.5h52.5l5-3-3.4 9.3c-.2.4-.5.7-1 .7H8c-.6 0-1.1-.4-1.3-.9L4 40.5z" fill="#1f5e3b"/>
